<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191a18" />
    <script>
      // Fija el tema antes de pintar para evitar el parpadeo. Solo una elección explícita queda guardada.
      (function () {
        var theme;
        try { theme = localStorage.getItem('fyv-theme'); } catch (error) { theme = null; }
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#16181a' : '#191a18';
      })();
    </script>
    <meta name="description" content="Dos propuestas agénticas para la inscripción y el pago en FUL Y VALE APP. TP3 · Grupo 04 AACMP · IFTS 29." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
